name: GharWatt static tools QA
on:
  push:
    branches: [main]
    paths:
      - 'gharwatt/**'
      - '.github/workflows/verify-gharwatt.yml'
  pull_request:
    paths:
      - 'gharwatt/**'
      - '.github/workflows/verify-gharwatt.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and calculator tests
        run: |
          node --check gharwatt/assets/app.js
          node --check gharwatt/assets/decision-tools.js
          node --check gharwatt/assets/bill-only.js
          node --check gharwatt/assets/product-showcase.js
          node --check gharwatt/assets/affiliate-popup.js
          node --check gharwatt/assets/electricity-guide.js
          node --check gharwatt/assets/energy-v2.js
          node --check gharwatt/assets/energy-v2-extra.js
          python3 -m json.tool gharwatt/assets/affiliate-links.json > /dev/null
          node --test gharwatt/tests/decision-tools.test.cjs gharwatt/tests/bill-only.test.cjs gharwatt/tests/product-showcase.test.cjs gharwatt/tests/affiliate-popup.test.cjs gharwatt/tests/electricity-guide.test.cjs gharwatt/tests/energy-v2.test.cjs gharwatt/tests/energy-v2-extra.test.cjs
      - name: Validate local page references
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('gharwatt')
          htmls=list(root.glob('*.html'))+list(root.glob('*/index.html'))
          assert len(htmls)>=48, len(htmls)
          bad=[]
          for page in htmls:
              src=page.read_text(encoding='utf-8')
              for url in re.findall(r'(?:href|src)=["\']([^"\']+)',src):
                  if not url or url.startswith(('http:','https:','#','mailto:','tel:','data:')):continue
                  path=url.split('#',1)[0].split('?',1)[0]
                  if path and not (page.parent/path).exists():bad.append((str(page),url))
          assert not bad,bad
          assert (root/'reduce-electricity-bill'/'index.html').exists(), 'missing electricity saving guide'
          for name in ['energy-tools','bill-reader','appliance-planner','bill-change','savings-goal','monthly-tracker','cooling-costs','solar-finance','roof-planner','appliance-star-compare','solar-vs-saving','smart-meter-csv','electricity-basics-telugu','electricity-basics-hindi']:
              assert (root/name/'index.html').exists(), f'missing page {name}'
          clean_pages=list(root.glob('*/index.html'))
          assert len(clean_pages)>=17,len(clean_pages)
          for page in clean_pages:
              slug=page.parent.name
              src=page.read_text(encoding='utf-8')
              assert f'https://chennamatta889.github.io/gharwatt/{slug}/' in src,slug
              assert 'href="../assets/styles.css"' in src,slug
              assert not re.search(r'(?:href|src)=[\"\'][^\"\']+\\.html(?:[#?][^\"\']*)?[\"\']',src),slug
          print('Validated',len(htmls),'HTML pages, clean links and old redirects')
          PY
