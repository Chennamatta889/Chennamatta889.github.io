name: GharWatt static tools QA
on:
  push:
    branches: [main]
    paths:
      - 'gharwatt/**'
      - '.github/workflows/verify-gharwatt.yml'
  pull_request:
    paths:
      - 'gharwatt/**'
      - '.github/workflows/verify-gharwatt.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and calculator tests
        run: |
          node --check gharwatt/assets/app.js
          node --check gharwatt/assets/decision-tools.js
          node --check gharwatt/assets/bill-only.js
          node --check gharwatt/assets/product-showcase.js
          node --check gharwatt/assets/affiliate-popup.js
          node --check gharwatt/assets/electricity-guide.js
          node --check gharwatt/assets/energy-v2.js
          node --check gharwatt/assets/energy-v2-extra.js
          node --check gharwatt/assets/toolkit-ui.js
          node --check gharwatt/assets/bill-advisor.js
          node --check gharwatt/assets/bill-crop.js
          node --check gharwatt/assets/simple-bill.js
          node --check gharwatt/assets/discover.js
          python3 -m json.tool gharwatt/assets/affiliate-links.json > /dev/null
          node --test gharwatt/tests/decision-tools.test.cjs gharwatt/tests/bill-only.test.cjs gharwatt/tests/product-showcase.test.cjs gharwatt/tests/affiliate-popup.test.cjs gharwatt/tests/electricity-guide.test.cjs gharwatt/tests/energy-v2.test.cjs gharwatt/tests/energy-v2-extra.test.cjs gharwatt/tests/toolkit-ui.test.cjs gharwatt/tests/bill-advisor.test.cjs gharwatt/tests/simple-bill.test.cjs gharwatt/tests/discover.test.cjs
      - name: Validate local page references
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('gharwatt')
          htmls=list(root.glob('*.html'))+list(root.glob('*/index.html'))
          assert len(htmls)>=48, len(htmls)
          bad=[]
          for page in htmls:
              src=page.read_text(encoding='utf-8')
              for url in re.findall(r'(?:href|src)=["\']([^"\']+)',src):
                  if not url or url.startswith(('http:','https:','#','mailto:','tel:','data:')):continue
                  path=url.split('#',1)[0].split('?',1)[0]
                  if path and not (page.parent/path).exists():bad.append((str(page),url))
          assert not bad,bad
          assert (root/'reduce-electricity-bill'/'index.html').exists(), 'missing electricity saving guide'
          assert (root/'discover'/'index.html').exists(), 'guided Discover page missing'
          discover=(root/'discover'/'index.html').read_text(encoding='utf-8')
          for element in ['gw-bill-amount','gw-bill-units','gw-bill-start','gw-bill-result','gw-appliance-grid','gw-challenge-list','gw-myth-options','gw-compare-output','gw-product-result','gw-track-preview','gw-solar-guidance','gw-clear-appliances']:
              assert f'id="{element}"' in discover, f'missing Discover element {element}'
          assert re.search(r'src="\.\./assets/discover\.js(?:\?[^\"]*)?"', discover), 'Discover JavaScript missing'
          assert re.search(r'href="\.\./assets/discover\.css(?:\?[^\"]*)?"', discover), 'Discover styles missing'
          home=(root/'index.html').read_text(encoding='utf-8')
          assert 'href="discover/"' in home and 'class="gw-home-discover"' in home, 'homepage journey missing'
          assert 'applianceContext' in (root/'assets'/'discover.js').read_text(encoding='utf-8'), 'appliance bill reconciliation missing'
          assert 'https://chennamatta889.github.io/gharwatt/discover/' in (root/'sitemap.xml').read_text(encoding='utf-8'), 'Discover sitemap missing'
          for name in ['energy-tools','bill-reader','appliance-planner','bill-change','savings-goal','monthly-tracker','cooling-costs','solar-finance','roof-planner','appliance-star-compare','solar-vs-saving','smart-meter-csv','electricity-basics-telugu','electricity-basics-hindi']:
              assert (root/name/'index.html').exists(), f'missing page {name}'
          clean_pages=list(root.glob('*/index.html'))
          assert len(clean_pages)>=17,len(clean_pages)
          for page in clean_pages:
              slug=page.parent.name
              src=page.read_text(encoding='utf-8')
              assert f'https://chennamatta889.github.io/gharwatt/{slug}/' in src,slug
              assert 'href="../assets/styles.css"' in src,slug
              assert not re.search(r'(?:href|src)=[\"\'][^\"\']+\\.html(?:[#?][^\"\']*)?[\"\']',src),slug
          # Verify refreshed dashboard and tool pages retain their source IDs and assets.
          hub=(root/'energy-tools'/'index.html').read_text(encoding='utf-8')
          assert 'id="gw-tool-search"' in hub, 'missing searchable tool directory'
          assert 'data-gw-filter="all"' in hub, 'missing filter controls'
          assert hub.count('data-gw-tool-card')>=15, 'tool cards are missing'
          assert 'src="../assets/toolkit-ui.js"' in hub, 'filter script missing'
          for name in ['energy-tools','bill-reader','appliance-planner','bill-change','savings-goal','monthly-tracker','cooling-costs','solar-finance','roof-planner','appliance-star-compare','solar-vs-saving','smart-meter-csv','electricity-basics-telugu','electricity-basics-hindi','electricity-bill','reduce-electricity-bill']:
              html=(root/name/'index.html').read_text(encoding='utf-8')
              assert re.search(r'href="\.\./assets/ui-refresh\.css(?:\?[^\"]*)?"',html), name
              if name!='energy-tools':
                  assert 'class="gw-tool-page"' in html, name
                  assert 'aria-label="Breadcrumb"' in html, name
          # OCR reliability controls must exist in the deployed bill-reader markup.
          photo_page=(root/'bill-reader'/'index.html').read_text(encoding='utf-8')
          for control in ['v2-photo','v2-read-photo','v2-ocr-cancel','v2-ocr-progress','v2-ocr-status','v2-manual-entry','v2-confirm-amount','v2-confirm-units']:
              assert f'id="{control}"' in photo_page, f'missing OCR control: {control}'
          assert 'href="#v2-manual-entry"' in photo_page, 'manual fallback unavailable'
          script=(root/'assets'/'energy-v2.js').read_text(encoding='utf-8')
          assert 'ocrResizePlan' in script and 'function stopReading' in script, 'OCR optimization/cancellation missing'
          assert 'extractPdf' in script and 'application/pdf' in script, 'PDF support missing'
          assert 'assessBillText' in script, 'unreliable OCR guard missing'
          assert 'id="gw-advisor"' in photo_page, 'bill advisor missing'
          assert 'id="gw-simple-bill"' in photo_page, 'instant calculator missing'
          assert 'id="gw-simple-amount"' in photo_page and 'id="gw-simple-units"' in photo_page, 'two-number inputs missing'
          assert 'id="gw-photo-details"' in photo_page, 'optional photo path missing'
          assert re.search(r'src="\.\./assets/simple-bill\.js(?:\?[^"]*)?"',photo_page), 'quick calculator JS missing'
          assert 'id="v2-crop-canvas"' in photo_page, 'photo crop UI missing'
          assert 'id="v2-confirm-arrears"' in photo_page, 'bill arrears input missing'
          assert re.search(r'src="\.\./assets/bill-crop\.js(?:\?[^"]*)?"',photo_page), 'photo crop script not loaded'
          assert 'data-gw-focus="amounts"' in photo_page and 'data-gw-focus="meter"' in photo_page, 'guided focus controls missing'
          assert 'ocrPageSegMode' in script, 'focused OCR page segmentation missing'
          assert 'id="gw-appliance-rows"' in photo_page, 'appliance plan missing'
          assert 'id="gw-confirm"' not in photo_page, 'obsolete confirmation control'
          assert re.search(r'src="\.\./assets/bill-advisor\.js(?:\?[^\"]*)?"', photo_page), 'advisor script not loaded'
          assert re.search(r'href="\.\./assets/bill-advisor\.css(?:\?[^\"]*)?"', photo_page), 'advisor CSS not loaded'
          assert (root/'assets'/'ui-refresh.css').exists(), 'missing UI design stylesheet'
          assert re.search(r'href="assets/ui-refresh\.css(?:\?[^\"]*)?"',(root/'index.html').read_text(encoding='utf-8')), 'homepage stylesheet missing'
          assert 'wireMobileDock' in (root/'assets'/'app.js').read_text(encoding='utf-8'), 'mobile navigation is missing'
          assert '.gw-mobile-dock' in (root/'assets'/'ui-refresh.css').read_text(encoding='utf-8'), 'mobile navigation styling is missing'
          print('Validated',len(htmls),'HTML pages, clean links and old redirects')
          PY
