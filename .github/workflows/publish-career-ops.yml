name: Publish Career-Ops at account homepage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-career-ops.yml"
      - "index.html"
      - "job-search.js"
      - "live-job-discovery-v2.js"
      - "tests/job-search-relevance.test.cjs"
      - "tests/live-job-discovery-v2.test.cjs"
      - "about.html"
      - "contact.html"
      - "privacy.html"
      - "terms.html"
      - "resources/**"
      - "enquiryflow/**"
      - "enquiryflow-v3/**"
      - "gharwatt/**"
      - "resource-styles.css"
      - "sitemap.xml"
      - "ads.txt"
      - "google*.html"
      - "robots.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: career-ops-root-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: 'https://chennamatta889.github.io/'
    steps:
      - name: Check out existing account homepage
        uses: actions/checkout@v4
        with:
          path: account-site

      - name: Check out Career-Ops source
        uses: actions/checkout@v4
        with:
          repository: Chennamatta889/career-ops-cloud
          ref: cf224193691c3030752a5e0663bdb70f45c0379a
          path: career-ops-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source, OAuth and routing
        working-directory: career-ops-source
        run: |
          node --check app.js
          node --check ../account-site/live-job-discovery-v2.js
          node --check ../account-site/job-search.js
          node --test ../account-site/tests/live-job-discovery-v2.test.cjs ../account-site/tests/job-search-relevance.test.cjs
          node --check ai-studio.js
          node --check job-text.js
          node --check job-search.js
          node --check india-jobs.js
          node --check external-job-search.js
          node --check enterprise-careers.js
          node --check enterprise-connector-policy.cjs
          node --check application-email.js
          node --check scripts/universal-job-scan.mjs
          node --check scripts/guard-public-feed.mjs
          node --test scripts/india-jobs.test.cjs scripts/external-job-search.test.cjs scripts/report-published-coverage.test.mjs scripts/enterprise-careers.test.cjs scripts/guard-public-feed.test.mjs scripts/universal-job-scan.test.mjs scripts/job-search.test.cjs scripts/application-email.test.cjs scripts/job-text.test.cjs scripts/google-oauth.test.cjs scripts/navigation-ui.test.cjs scripts/phase45-stability.test.cjs

      - name: Verify Ctech Academy catalogue and production routes
        working-directory: account-site/enquiryflow-v3
        shell: bash
        run: |
          node --check assets/ctech-catalogue.js
          node --check assets/production-staff.js
          node --check assets/production-student.js
          node --check assets/staff-form.js
          node --test tests/ctech-catalogue.test.mjs tests/main-launch.test.mjs

      - name: Install browser resume extraction libraries
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/career-ops-vendor" \
            --no-save --package-lock=false --ignore-scripts --omit=optional \
            --no-audit --no-fund pdfjs-dist@5.4.624 mammoth@1.11.0

      - name: Assemble Career-Ops with preserved previous sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/data site/vendor site/portfolio
          # Original personal portfolio: https://chennamatta889.github.io/portfolio/
          cp -R account-site/portfolio/. site/portfolio/
          # Original DraftflowAI remains at /draftflowai/
          if [ -d account-site/draftflowai ]; then
            cp -R account-site/draftflowai site/draftflowai
          fi
          # Publish isolated EnquiryFlow static demo without changing Career-Ops files.
          test -s account-site/enquiryflow/index.html
          mkdir -p site/enquiryflow
          cp account-site/enquiryflow/index.html site/enquiryflow/index.html
          # Publish isolated GharWatt solar tools without changing existing website assets.
          test -s account-site/gharwatt/index.html
          cp -R account-site/gharwatt site/gharwatt
          # Preserve and publish isolated EnquiryFlow v3 demo; no changes to v2.
          mkdir -p site/enquiryflow-v3/staff site/enquiryflow-v3/assets
          cp account-site/enquiryflow-v3/index.html site/enquiryflow-v3/
          cp account-site/enquiryflow-v3/staff/index.html site/enquiryflow-v3/staff/
          cp account-site/enquiryflow-v3/assets/* site/enquiryflow-v3/assets/
          # Preserve the original fictional-only student and staff demo as a separate rollback route.
          test -s account-site/enquiryflow-v3/demo/index.html
          test -s account-site/enquiryflow-v3/demo/staff/index.html
          cp -R account-site/enquiryflow-v3/demo site/enquiryflow-v3/demo
          # Career-Ops is now the site's index, not a frame or redirect.
          cp career-ops-source/index.html career-ops-source/styles.css \
             career-ops-source/match-engine.js career-ops-source/job-categories.js \
             career-ops-source/job-text.js career-ops-source/job-search.js career-ops-source/india-jobs.js career-ops-source/external-job-search.js career-ops-source/enterprise-careers.js career-ops-source/application-email.js career-ops-source/careerops-config.js \
             career-ops-source/app.js career-ops-source/resume-parser.js \
             career-ops-source/ai-studio.js career-ops-source/private-workspace.js \
             career-ops-source/health-check.js site/
          # Root HTML is canonical. Never overwrite repaired navigation with older source HTML.
          cp account-site/index.html site/index.html
          # Support old root HTML cached by browsers that requests singular style.css.
          cp career-ops-source/styles.css site/style.css
          cp career-ops-source/about.html career-ops-source/contact.html \
             career-ops-source/privacy.html career-ops-source/terms.html \
             career-ops-source/resource-styles.css career-ops-source/ads.txt \
             career-ops-source/robots.txt career-ops-source/sitemap.xml site/
          # Search Console serves its exact account-provided verification HTML
          # at the site root. Keep it in this account-site repository so
          # re-deploying Career-Ops does not accidentally remove ownership.
          for verification_file in account-site/google*.html; do
            [ -f "$verification_file" ] || continue
            verification_name="$(basename "$verification_file")"
            if ! grep -Fqx "google-site-verification: $verification_name" "$verification_file"; then
              echo "Invalid Search Console verification file: $verification_name" >&2
              exit 1
            fi
            cp "$verification_file" "site/$verification_name"
          done
          # Preserve the tested Phase 11 search-relevance hotfix across deployments.
          cp account-site/app.js site/app.js
          cp account-site/job-search.js site/job-search.js
          cp account-site/live-job-discovery-v2.js site/live-job-discovery-v2.js
          cp account-site/index.html site/index.html
          cp -R career-ops-source/resources site/resources
          cp career-ops-source/enterprise-careers.json site/data/enterprise-careers.json
          # Version app and CSS URLs for every deployment to prevent stale
          # browser caches from combining an old script with a new HTML layout.
          sed -i -e "s|?v=20261121-experience-filter-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261121-application-confirmation-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261121-phase08-10-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261121-search-relevance-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261121-phase10b-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261121-mobile-nav-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261121-india-portals-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261121-india-scope-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261122-root-nav-repair|?v=$GITHUB_RUN_ID|g" site/index.html
          # Embed the same CSS as a local fallback: the UI remains styled even if
          # mobile browsers request a stale or blocked external stylesheet.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          html=Path("site/index.html")
          css=Path("site/styles.css").read_text(encoding="utf-8")
          page=html.read_text(encoding="utf-8")
          assert "</head>" in page and "rel=\"stylesheet\"" in page
          assert "</style" not in css.lower(), "Unsafe CSS style terminator"
          if 'id="careerops-css-fallback"' not in page:
              page=page.replace("</head>", '<style id="careerops-css-fallback">\n'+css+'\n</style>\n</head>', 1)
          # Cache-bust both active scripts even when their version labels change.
          page=re.sub(r'(\./(?:app|job-search|live-job-discovery-v2)\.js\?v=)[^"]+',
                      lambda m: m.group(1)+os.environ["GITHUB_RUN_ID"], page)
          html.write_text(page,encoding="utf-8")
          PY
          cp "$RUNNER_TEMP/career-ops-vendor/node_modules/pdfjs-dist/build/pdf.min.mjs" site/vendor/
          cp "$RUNNER_TEMP/career-ops-vendor/node_modules/pdfjs-dist/build/pdf.worker.min.mjs" site/vendor/
          cp "$RUNNER_TEMP/career-ops-vendor/node_modules/mammoth/mammoth.browser.min.js" site/vendor/
          touch site/.nojekyll

      - name: Refresh public IT and non-IT employer vacancies
        working-directory: career-ops-source
        shell: bash
        run: |
          FEED_OUTPUT="$GITHUB_WORKSPACE/site/data/jobs.json" node scripts/universal-job-scan.mjs
          node scripts/guard-public-feed.mjs "$GITHUB_WORKSPACE/site/data/jobs.json"

      - name: Verify output and preserved portfolio
        shell: bash
        run: |
          set -euo pipefail
          for asset in index.html app.js live-job-discovery-v2.js ai-studio.js careerops-config.js \
            private-workspace.js job-text.js job-search.js india-jobs.js external-job-search.js enterprise-careers.js application-email.js health-check.js style.css styles.css \
            vendor/pdf.min.mjs vendor/pdf.worker.min.mjs \
            vendor/mammoth.browser.min.js data/jobs.json data/enterprise-careers.json \
            portfolio/index.html portfolio/styles.css portfolio/script.js \
            enquiryflow/index.html enquiryflow-v3/index.html enquiryflow-v3/staff/index.html \
            enquiryflow-v3/assets/firebase-platform.js \
            portfolio/profile.jpg draftflowai/index.html \
            privacy.html about.html contact.html terms.html \
            resource-styles.css resources/index.html \
            ads.txt robots.txt sitemap.xml; do
              test -s "site/$asset"
          done
          ! grep -q '<base href="/career-ops-cloud/">' site/index.html
          cmp -s site/style.css site/styles.css
          grep -Fq 'id="careerops-css-fallback"' site/index.html
          grep -Fq "./styles.css" site/index.html
          grep -q 'id="page-discover"' site/index.html
          grep -q 'id="loadMoreJobs"' site/index.html
          grep -q 'id="feedFreshness"' site/index.html
          grep -q 'id="jobsGrid"' site/index.html
          grep -q 'id="experienceFilter"' site/index.html
          grep -q 'id="dialogExperience"' site/index.html
          grep -Fq "./job-text.js?v=$GITHUB_RUN_ID" site/index.html
          grep -Fq "./app.js" site/index.html
          grep -Fq "./job-search.js?v=$GITHUB_RUN_ID" site/index.html
          grep -Fq "./india-jobs.js?v=$GITHUB_RUN_ID" site/index.html
          grep -Fq "./external-job-search.js?v=$GITHUB_RUN_ID" site/index.html
          grep -Fq "./enterprise-careers.js?v=$GITHUB_RUN_ID" site/index.html
          grep -q 'id="enterpriseCareerDirectory"' site/index.html
          grep -q 'id="enterpriseCareerCards"' site/index.html
          grep -q 'id="searchDescriptions"' site/index.html
          grep -Fq "./application-email.js?v=$GITHUB_RUN_ID" site/index.html
          grep -q 'id="emailReviewPanel"' site/index.html
          grep -q 'id="applicationDuplicateWarning"' site/index.html
          grep -Fq "./private-workspace.js?v=$GITHUB_RUN_ID" site/index.html
          grep -q 'id="applicationFollowup"' site/index.html
          grep -q 'id="confirmAppliedDate"' site/index.html
          grep -q 'id="confirmNotYet"' site/index.html
          grep -Fq 'pendingTrackingWrites' site/private-workspace.js
          grep -Fq "./styles.css?v=$GITHUB_RUN_ID" site/index.html
          grep -Fq 'id="resultsCount" hidden' site/index.html
          grep -Fq 'id="navJobsCount" hidden' site/index.html
          ! grep -q 'capped at 500' site/index.html
          node -e 'const f=require("./site/data/jobs.json"); if(f.schema!=="careerops.public-jobs.v1"||!Array.isArray(f.jobs)||f.scan.max_published!==undefined) process.exit(1); const types=Object.values(f.category_counts); if(types.reduce((a,b)=>a+b,0)!==f.jobs.length) process.exit(2);'
          grep -q 'DISCOVER_PAGE_SIZE' site/app.js
          grep -q 'https://chennamatta889.github.io/' site/ai-studio.js
          grep -q '"careerops.public-jobs.v1"' site/data/jobs.json
          for verification_file in account-site/google*.html; do
            [ -f "$verification_file" ] || continue
            cmp -s "$verification_file" "site/$(basename "$verification_file")"
          done
          echo "Root build validated, old portfolio and DraftflowAI retained."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Allow Pages artifact metadata to propagate
        run: sleep 12

      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test root, career guides and preserved websites
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            # Write response to a file first: curl | grep -q under pipefail can
            # fail with curl code 23 if grep closes the pipe after a match.
            curl -fsSL --max-time 15 \
              "https://chennamatta889.github.io/?release=$GITHUB_RUN_ID" \
              -o /tmp/career-ops-root.html || true
            if [ -s /tmp/career-ops-root.html ] && \
                 grep -Fq 'id="page-discover"' /tmp/career-ops-root.html; then
              echo "Career-Ops is live at the root URL."
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Root did not serve Career-Ops; inspect Pages publishing source." >&2
              exit 1
            fi
            sleep 6
          done
          # GharWatt: verify actual deployed Pages content, not just the repository files.
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/?verify=$GITHUB_RUN_ID" -o /tmp/gharwatt-live.html
          grep -Fq 'id="solar-calculator"' /tmp/gharwatt-live.html
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/electricity-bill/?verify=$GITHUB_RUN_ID" -o /tmp/gharwatt-bill.html
          grep -Fq 'id="bill-analyzer"' /tmp/gharwatt-bill.html
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/system-size-comparison/?verify=$GITHUB_RUN_ID" -o /tmp/gharwatt-sizes.html
          grep -Fq 'id="size-comparison"' /tmp/gharwatt-sizes.html
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/assets/decision-tools.js?verify=$GITHUB_RUN_ID" -o /tmp/gharwatt-tools.js
          grep -Fq 'GharWattDecisionMath' /tmp/gharwatt-tools.js
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/solar-subsidy/?verify=$GITHUB_RUN_ID" -o /tmp/gharwatt-subsidy.html
          grep -Fq 'PM Surya Ghar Subsidy' /tmp/gharwatt-subsidy.html
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/solar-subsidy.html?verify=$GITHUB_RUN_ID" -o /tmp/gharwatt-legacy-subsidy.html
          grep -Fq 'url=https://chennamatta889.github.io/gharwatt/solar-subsidy/' /tmp/gharwatt-legacy-subsidy.html
          echo "GharWatt clean URLs, original legacy redirect and tool scripts are live."
          # GharWatt V2: require actual deployed visitor tools, not only committed source.
          for entry in "energy-tools|Save electricity. Understand every rupee." "bill-reader|id=\"v2-reader\"" "appliance-planner|id=\"v2-appliances\"" "bill-change|id=\"v2-bill-compare\"" "savings-goal|id=\"v2-goal\"" "monthly-tracker|id=\"v2-tracker\"" "solar-finance|id=\"v2-finance\"" "roof-planner|id=\"v2-roof\"" "smart-meter-csv|id=\"v2-csv-reader\"" "appliance-star-compare|id=\"v2-star-label\"" "solar-vs-saving|id=\"v2-solar-habits\"" "electricity-basics-telugu|కరెంటు బిల్లు" "electricity-basics-hindi|बिजली का बिल"; do
            slug="${entry%%|*}"
            expected="${entry#*|}"
            curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/$slug/?verify=$GITHUB_RUN_ID" -o "/tmp/gharwatt-v2-$slug.html"
            grep -Fq "$expected" "/tmp/gharwatt-v2-$slug.html"
          done
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/assets/energy-v2.js?verify=$GITHUB_RUN_ID" -o /tmp/gharwatt-v2-live.js
          grep -Fq 'GharWattV2' /tmp/gharwatt-v2-live.js
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL --max-time 25 "https://chennamatta889.github.io/gharwatt/assets/energy-v2-extra.js?verify=$GITHUB_RUN_ID" -o /tmp/gharwatt-v2-extra-live.js
          grep -Fq 'GharWattV2Extra' /tmp/gharwatt-v2-extra-live.js
          echo "GharWatt V2: all core and advanced energy tools are publicly reachable."

          curl -fsSL --max-time 15 "https://chennamatta889.github.io/enquiryflow-v3/" -o /tmp/enquiryflow-v3-student.html
          grep -Fq "Ctech Academy | Courses and Student Enquiries" /tmp/enquiryflow-v3-student.html
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/enquiryflow-v3/staff/" -o /tmp/enquiryflow-v3-staff.html
          grep -Fq "Ctech Academy | Staff Dashboard" /tmp/enquiryflow-v3-staff.html
          # Make sure the original fictional demo remains available as a rollback option.
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/enquiryflow-v3/demo/" -o /tmp/enquiryflow-v3-rollback.html
          grep -Fq "EnquiryFlow v3 | Fictional Demo" /tmp/enquiryflow-v3-rollback.html
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/enquiryflow-v3/demo/staff/" -o /tmp/enquiryflow-v3-rollback-staff.html
          grep -Fq "EnquiryFlow v3 | Demo Staff Workspace" /tmp/enquiryflow-v3-rollback-staff.html
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/enquiryflow/" -o /tmp/enquiryflow-demo.html
          grep -Fq "EnquiryFlow v2" /tmp/enquiryflow-demo.html
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/portfolio/" -o /tmp/career-ops-portfolio.html
          grep -Fq 'Cloud DevOps Engineer' /tmp/career-ops-portfolio.html
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/draftflowai/" -o /tmp/career-ops-draftflow.html
          grep -iq 'Draftflow' /tmp/career-ops-draftflow.html
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/resources/" -o /tmp/career-ops-guides.html
          grep -Fq 'ats-resume-guide.html' /tmp/career-ops-guides.html
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/privacy.html" -o /tmp/career-ops-privacy.html
          grep -Fq 'Privacy Policy' /tmp/career-ops-privacy.html
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/ads.txt" -o /tmp/career-ops-ads.txt
          grep -Fq 'pub-4795680811840492' /tmp/career-ops-ads.txt
          curl -fsSL --max-time 15 "https://chennamatta889.github.io/sitemap.xml" -o /tmp/career-ops-sitemap.xml
          grep -Fq '/resources/' /tmp/career-ops-sitemap.xml
          # A successful homepage is not enough: the job cards need the public
          # data file and the new browser script at the same root path.
          curl --retry 3 --retry-delay 2 -fsSL --max-time 40 "https://chennamatta889.github.io/data/jobs.json?verify=$GITHUB_RUN_ID" -o /tmp/career-ops-live-jobs.json
          node -e 'const f=require("/tmp/career-ops-live-jobs.json"); if(f.schema!=="careerops.public-jobs.v1"||!Array.isArray(f.jobs)||f.jobs.length<1||!Array.isArray(f.source_health)||f.source_health.length<50) process.exit(1); console.log("Public root job feed is accessible with verified source health");'
          node -e 'const f=require("/tmp/career-ops-live-jobs.json");if(!f.source_health.some(s=>s.provider==="lever"&&s.status==="ok"))process.exit(1);console.log("Verified public Lever employer postings are included in job discovery");'
          node -e 'const f=require("/tmp/career-ops-live-jobs.json");const titles=f.jobs.filter(j=>/servicenow|service now/i.test(j.title||""));console.log("Live public ServiceNow-titled roles from employer feeds:",titles.length);if(!titles.length)console.warn("No ServiceNow-titled openings in current scan; check employer boards before making availability claims.");'
          curl --retry 3 -fsSL --max-time 20 "https://chennamatta889.github.io/app.js?verify=$GITHUB_RUN_ID" -o /tmp/career-ops-live-app.js
          grep -Fq 'discoverFeedStatus' /tmp/career-ops-live-app.js
          grep -Fq 'jobsGrid' /tmp/career-ops-live-app.js
          grep -Fq 'experienceFilter' /tmp/career-ops-live-app.js
          grep -Fq 'recordEmployerOpen' /tmp/career-ops-live-app.js
          grep -Fq 'confirmApplication' /tmp/career-ops-live-app.js
          grep -Fq 'analyseEmailReview' /tmp/career-ops-live-app.js
          grep -Fq 'No jobs match this combination' /tmp/career-ops-live-app.js
          curl --retry 3 -fsSL --max-time 20 "https://chennamatta889.github.io/enterprise-careers.js?verify=$GITHUB_RUN_ID" -o /tmp/career-ops-live-enterprise.js
          grep -Fq 'CareerOpsEnterpriseCareers' /tmp/career-ops-live-enterprise.js
          curl --retry 3 -fsSL --max-time 20 "https://chennamatta889.github.io/data/enterprise-careers.json?verify=$GITHUB_RUN_ID" -o /tmp/career-ops-live-enterprise.json
          node -e 'const d=require("/tmp/career-ops-live-enterprise.json");if(d.schema!=="careerops.enterprise-careers.v1"||d.companies.length!==13||d.companies.some(p=>p.method!=="official_portal"))process.exit(1);console.log("All 13 verified official company career links available separately from jobs.");'
          curl --retry 3 -fsSL --max-time 20 "https://chennamatta889.github.io/job-search.js?verify=$GITHUB_RUN_ID" -o /tmp/career-ops-live-job-search.js
          grep -Fq 'CareerOpsJobSearch' /tmp/career-ops-live-job-search.js
          curl --retry 3 -fsSL --max-time 20 "https://chennamatta889.github.io/application-email.js?verify=$GITHUB_RUN_ID" -o /tmp/career-ops-live-email.js
          grep -Fq 'isLikelyAcknowledgement' /tmp/career-ops-live-email.js
          curl --retry 3 -fsSL --max-time 20 "https://chennamatta889.github.io/private-workspace.js?verify=$GITHUB_RUN_ID" -o /tmp/career-ops-live-private.js
          grep -Fq 'pendingTrackingWrites' /tmp/career-ops-live-private.js
          curl --retry 3 -fsSL --max-time 20 "https://chennamatta889.github.io/job-text.js?verify=$GITHUB_RUN_ID" -o /tmp/career-ops-live-job-text.js
          grep -Fq 'experienceRequirement' /tmp/career-ops-live-job-text.js
          node -e 'const f=require("/tmp/career-ops-live-jobs.json"); const filled=f.jobs.filter(j=>typeof j.requiredExperience==="string"&&j.requiredExperience); if(filled.length===0) process.exit(2); console.log("Employer-stated experience fields present in public feed:",filled.length);'
          grep -Fq 'id="loadMoreJobs"' /tmp/career-ops-root.html
          grep -Fq 'id="feedFreshness"' /tmp/career-ops-root.html
          grep -Fq "./app.js?v=$GITHUB_RUN_ID" /tmp/career-ops-root.html
          grep -Fq 'id="experienceFilter"' /tmp/career-ops-root.html
          grep -Fq 'id="applicationFollowup"' /tmp/career-ops-root.html
          grep -Fq 'id="emailReviewPanel"' /tmp/career-ops-root.html
          grep -Fq 'id="searchDescriptions"' /tmp/career-ops-root.html
          grep -Fq 'id="enterpriseCareerDirectory"' /tmp/career-ops-root.html
          grep -Fq 'id="confirmApplied"' /tmp/career-ops-root.html
          grep -Fq 'id="resultsCount" hidden' /tmp/career-ops-root.html
          ! grep -Fq 'capped at 500' /tmp/career-ops-root.html
          # Google must be able to request the exact file publicly, not an SPA page.
          for verification_file in account-site/google*.html; do
            [ -f "$verification_file" ] || continue
            verification_name="$(basename "$verification_file")"
            verified=false
            for attempt in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 15 "https://chennamatta889.github.io/$verification_name" -o "/tmp/$verification_name" && cmp -s "$verification_file" "/tmp/$verification_name"; then
                verified=true
                break
              fi
              sleep 5
            done
            if [ "$verified" != "true" ]; then
              echo "Search Console file not publicly available: /$verification_name" >&2
              exit 1
            fi
            echo "Search Console file available at /$verification_name"
          done
          echo "Homepage, career guides, legal pages, ads.txt, sitemap, portfolio and DraftflowAI verified."
